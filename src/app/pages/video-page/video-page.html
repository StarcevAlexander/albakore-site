<section class="video-page">
  <div class="container">
    <h1 class="page-title">Видео о машинах <em class="rm-brand"><span class="rm-rub">РУБ</span><span class="rm-master">МАСТЕР</span></em></h1>

    <div class="video-page__grid">
      @for (video of videos; track video.title) {
        <div class="video-page__item">
          <div class="video-page__frame">
            <iframe
              [src]="video.url"
              [title]="video.title"
              allowfullscreen
              loading="lazy">
            </iframe>
          </div>
          <p class="video-page__title">{{ video.title }}</p>
        </div>
      }
    </div>
  </div>
</section>
