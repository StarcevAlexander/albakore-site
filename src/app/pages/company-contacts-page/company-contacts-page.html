<div class="company-contacts">

  <section class="company-contacts__hero">
    <div class="container">
      <h1 class="page-title">Контакты <em class="rm-brand"><span class="rm-rub">RUB</span><span class="rm-master">MASTER</span></em></h1>
    </div>
  </section>

  <section class="company-contacts__info">
    <div class="container">
      <div class="company-contacts__layout">

        <div class="company-contacts__details">
          @for (item of contacts; track item.label) {
            <div class="contact-item">
              <span class="contact-item__label">{{ item.label }}</span>
              @if (item.href) {
                <a [href]="item.href" class="contact-item__value contact-item__value--link">
                  {{ item.value }}
                </a>
              } @else {
                <span class="contact-item__value">{{ item.value }}</span>
              }
            </div>
          }

          <div class="company-contacts__requisites">
            <h3>Реквизиты</h3>
            <ul>
              <li><span>Полное наименование</span><strong>ООО «Промсервис»</strong></li>
              <li><span>ИНН</span><strong>— уточняется —</strong></li>
              <li><span>Адрес</span><strong>600007, г. Владимир, ул. Полины Осипенко, 58</strong></li>
            </ul>
          </div>
        </div>

        <div class="company-contacts__map">
          <iframe
            src="https://yandex.ru/map-widget/v1/?ll=40.3832&z=14&text=г.+Владимир+ул.+Полины+Осипенко+58"
            title="Карта RubMaster"
            frameborder="0"
            allowfullscreen
            loading="lazy">
          </iframe>
        </div>

      </div>
    </div>
  </section>

  <app-contact-form></app-contact-form>

</div>
