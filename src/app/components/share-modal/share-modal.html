<div class="share-modal__backdrop" (click)="onBackdrop($event)">
  <div class="share-modal__panel">

    <div class="share-modal__head">
      <div class="share-modal__icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M18 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM6 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM18 22a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM8.59 13.51l6.83 3.98M15.41 6.51l-6.82 3.98"
            stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h3 class="share-modal__title">Поделиться товаром</h3>
      <button class="share-modal__close" (click)="close()" aria-label="Закрыть">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M1 1l16 16M17 1L1 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <ul class="share-modal__list">
      <li>
        <button class="share-modal__item" (click)="copyLink()">
          <span class="share-modal__item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="9" y="9" width="13" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" stroke="currentColor" stroke-width="2"/>
            </svg>
          </span>
          <span>{{ copied ? 'Скопировано!' : 'Копировать ссылку' }}</span>
        </button>
      </li>
      <li>
        <button class="share-modal__item" (click)="shareEmail()">
          <span class="share-modal__item-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="2" y="4" width="20" height="16" rx="2" stroke="currentColor" stroke-width="2"/>
              <path d="M2 7l10 7 10-7" stroke="currentColor" stroke-width="2"/>
            </svg>
          </span>
          <span>Отправить на E-mail</span>
        </button>
      </li>
      <li>
        <button class="share-modal__item" (click)="shareTelegram()">
          <span class="share-modal__item-icon share-modal__item-icon--telegram">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
              <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2Zm4.93 7.28-1.69 7.96c-.13.57-.47.71-.95.44l-2.62-1.93-1.27 1.22c-.14.14-.26.26-.53.26l.19-2.67 4.84-4.37c.21-.19-.05-.29-.32-.1L7.9 14.47l-2.57-.8c-.56-.17-.57-.56.12-.83l10.04-3.87c.47-.17.88.11.74.31Z"/>
            </svg>
          </span>
          <span>Telegram</span>
        </button>
      </li>
      <li>
        <button class="share-modal__item" (click)="shareWhatsApp()">
          <span class="share-modal__item-icon share-modal__item-icon--whatsapp">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
              <path d="M12 2C6.477 2 2 6.477 2 12c0 1.9.52 3.67 1.42 5.18L2 22l4.94-1.41A9.96 9.96 0 0 0 12 22c5.523 0 10-4.477 10-10S17.523 2 12 2Zm5.07 14.27c-.22.61-1.08 1.11-1.77 1.26-.47.1-1.08.18-3.14-.67-2.64-1.08-4.34-3.76-4.47-3.93-.13-.18-1.06-1.41-1.06-2.69 0-1.28.67-1.91.9-2.17.22-.26.48-.32.64-.32h.46c.15 0 .35-.06.54.41l.77 1.88c.07.17.04.37-.07.52l-.43.56-.32.33c-.11.11-.23.23-.1.46.14.22.6.99 1.29 1.6.89.79 1.63 1.03 1.86 1.15.22.11.35.09.48-.05l.65-.74c.17-.19.34-.12.56-.07l1.6.75c.22.1.36.15.41.24.06.09.06.52-.16 1.13Z"/>
            </svg>
          </span>
          <span>WhatsApp</span>
        </button>
      </li>
      <li>
        <button class="share-modal__item" (click)="shareVk()">
          <span class="share-modal__item-icon share-modal__item-icon--vk">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
              <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2Zm4.93 13.5h-1.5c-.57 0-.74-.45-1.76-1.49-.88-.87-1.27-.98-1.49-.98-.3 0-.39.09-.39.51v1.36c0 .36-.12.57-1.1.57-1.62 0-3.41-.98-4.67-2.8C4.85 10.44 4.5 8.7 4.5 8.36c0-.22.09-.42.51-.42h1.5c.38 0 .52.18.67.6.73 2.12 1.96 3.98 2.46 3.98.19 0 .28-.09.28-.58V9.77c-.06-1.05-.61-1.14-.61-1.51 0-.18.15-.36.39-.36h2.36c.32 0 .43.17.43.54v2.9c0 .32.14.43.23.43.19 0 .35-.11.7-.46 1.08-1.21 1.85-3.08 1.85-3.08.1-.22.29-.43.67-.43h1.5c.45 0 .55.23.45.54-.19.88-2.01 3.44-2.01 3.44-.16.26-.22.37 0 .66.16.22.69.67 1.04 1.08.65.74 1.14 1.36 1.27 1.79.14.42-.08.64-.5.64Z"/>
            </svg>
          </span>
          <span>ВКонтакте</span>
        </button>
      </li>
      <li>
        <button class="share-modal__item" (click)="shareOk()">
          <span class="share-modal__item-icon share-modal__item-icon--ok">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
              <path d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2Zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm4.5 8.5c-.4.4-1.83.96-3.09 1.13l2.59 2.59a.75.75 0 1 1-1.06 1.06L12 16.35l-2.94 2.93a.75.75 0 1 1-1.06-1.06l2.59-2.59c-1.26-.17-2.69-.73-3.09-1.13a.75.75 0 1 1 1.06-1.06c.8.8 2.35 1.31 3.44 1.31s2.64-.51 3.44-1.31a.75.75 0 0 1 1.06 1.06Z"/>
            </svg>
          </span>
          <span>Одноклассники</span>
        </button>
      </li>
    </ul>

  </div>
</div>
