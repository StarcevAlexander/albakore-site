<div class="partner-card">
  <h3 class="partner-card__name">{{ partner().name }}</h3>
  <p class="partner-card__city">{{ partner().city }}</p>
  <p class="partner-card__address">{{ partner().address }}</p>
  <div class="partner-card__phones">
    @for (phone of partner().phones; track phone.href) {
      <a [href]="phone.href">{{ phone.label }}</a>
    }
  </div>
</div>
