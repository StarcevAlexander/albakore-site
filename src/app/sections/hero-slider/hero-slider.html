<section class="hero-slider">

  <div class="swiper" #swiperEl>
    <div class="swiper-wrapper">
      @for (slide of slides; track $index) {
        <div class="swiper-slide hero-slider__slide"
             [style]="'background-image: url(' + slide + ')'">
        </div>
      }
    </div>
    <div class="hero-slider__dots"></div>
  </div>

  <div class="hero-slider__content">
    <div class="container">
      <p class="hero-slider__label">Производство катеров и яхт</p>
      <h1 class="hero-slider__title">
        в <em>Санкт-Петербурге</em>
      </h1>
      <p class="hero-slider__desc">
        Albakore – это не просто бренд, это стиль жизни на воде.
        Мы создаём алюминиевые катера и яхты, которые покоряют стихию и сердца.
      </p>
      <div class="hero-slider__btns">
        <a routerLink="/catalog" class="btn btn--primary"><span>Модельный ряд</span></a>
        <a routerLink="/dealers" class="btn btn--secondary-white"><span>Дилерская сеть</span></a>
      </div>
    </div>
  </div>

</section>
