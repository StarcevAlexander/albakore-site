<section class="catalog" id="catalog">
  <div class="container">
    <h1 class="page-title">Модельный ряд <em class="rm-brand"><span class="rm-rub">RUB</span><span class="rm-master">MASTER</span></em></h1>

    <div class="catalog__grid">
      @for (model of models; track model.slug) {
        <div class="catalog-card">
          <a [routerLink]="['/catalog', model.slug]" class="catalog-card__img">
            <img [src]="model.img" [alt]="model.name" loading="lazy">
          </a>
          <div class="catalog-card__body">
            <h3 class="catalog-card__name">{{ model.name }}</h3>
            <ul class="catalog-card__specs">
              <li><span>Длина</span><strong>{{ model.length }}</strong></li>
              <li><span>Вместимость</span><strong>{{ model.capacity }}</strong></li>
              <li><span>Материал</span><strong>{{ model.material }}</strong></li>
            </ul>
            <div class="catalog-card__actions">
              <a [routerLink]="['/catalog', model.slug]" class="btn btn--secondary-white catalog-card__btn">
                <span>Подробнее</span>
              </a>
              <a routerLink="/company-contacts" class="btn btn--primary catalog-card__btn">
                <span>Узнать стоимость</span>
              </a>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
