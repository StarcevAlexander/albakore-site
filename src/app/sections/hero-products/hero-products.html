<section class="hero-products">
  <div class="container hero-products__inner">
  @for (product of products; track product.model) {
    <div class="hero-product" [class.hero-product--reversed]="product.reversed">
      <div class="hero-product__img-wrap">
        <img [src]="product.img.replace('.webp', '-sm.webp')" [alt]="product.model" width="800" height="600" loading="lazy" decoding="async">
      </div>
      <div class="hero-product__content">
        <span class="hero-product__badge">{{ product.badge }}</span>
        <h2 class="hero-product__title">
          {{ product.title }}<br>
          <em>{{ product.model }}</em>
        </h2>
        <p class="hero-product__desc">{{ product.desc }}</p>
        <div class="hero-product__btns">
          <a [routerLink]="product.catalogUrl" class="btn btn--primary"><span>В каталог</span></a>
          <a routerLink="/dealers" class="btn btn--secondary"><span>Где купить</span></a>
        </div>
      </div>
    </div>
  }
  </div>
</section>
