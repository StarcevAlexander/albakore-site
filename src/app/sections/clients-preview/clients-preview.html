<section class="clients-preview">
  <div class="container">
    <span class="section-label">Машины в работе</span>
    <h2 class="section-title">Техника у наших клиентов</h2>

    <div class="clients-preview__grid">
      @for (item of cases; track item.img) {
        <div class="clients-preview__card">
          <a class="clients-preview__img-wrap" [href]="item.img" target="_blank" rel="noopener">
            <img [src]="item.img" [alt]="item.model + ' — ' + item.location" width="400" height="300" loading="lazy" decoding="async">
          </a>
          <div class="clients-preview__info">
            <span class="clients-preview__model">{{ item.model }}</span>
            <span class="clients-preview__location">{{ item.location }}</span>
            <span class="clients-preview__year">{{ item.year }}</span>
          </div>
        </div>
      }
    </div>
  </div>
</section>
