<header class="header" [class.header--scrolled]="scrolled()">
  <div class="container header__inner">

    <a routerLink="/" class="header__logo">
      <img src="//i.siteapi.org/aicyuL6Tpz32fv-cvIDvQCPnwA0=/fit-in/180x430/filters:format(png):upscale()/s.siteapi.org/fd0650dee05b0a9.ru/logo/42tw87xnlkg04cwck04o0ow0g8oowg"
           alt="Albakore" width="160">
    </a>

    <!-- Desktop: 2-row nav centered between logo and phone -->
    <nav class="header__nav">
      <div class="header__nav-row">
        @for (link of navRow1; track link.label) {
          <a
            [routerLink]="link.route"
            routerLinkActive="header__link--active"
            [routerLinkActiveOptions]="{ exact: link.route === '/' }"
            class="header__link"
          >{{ link.label }}</a>
        }
      </div>
      <div class="header__nav-row">
        @for (link of navRow2; track link.label) {
          <a
            [routerLink]="link.route"
            routerLinkActive="header__link--active"
            [routerLinkActiveOptions]="{ exact: link.route === '/' }"
            class="header__link"
          >{{ link.label }}</a>
        }
      </div>
    </nav>

    <a href="tel:+78129301628" class="btn btn--primary header__phone"><span>8 (812) 930-16-28</span></a>

    <button class="header__burger" (click)="toggleMenu()" [class.header__burger--open]="menuOpen()" aria-label="Меню">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <!-- Mobile overlay nav -->
    <nav class="header__nav-mobile" [class.header__nav-mobile--open]="menuOpen()">
      @for (link of navLinks; track link.label) {
        <a
          [routerLink]="link.route"
          routerLinkActive="header__link--active"
          [routerLinkActiveOptions]="{ exact: link.route === '/' }"
          class="header__link"
          (click)="closeMenu()"
        >{{ link.label }}</a>
      }
      <a href="tel:+78129301628" class="btn btn--primary header__cta-mobile"><span>8 (812) 930-16-28</span></a>
    </nav>

  </div>
</header>
