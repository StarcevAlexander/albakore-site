<header class="header" [class.header--scrolled]="scrolled()">
  <div class="container header__inner">
    <a href="#" class="header__logo">
      <img src="//i.siteapi.org/aicyuL6Tpz32fv-cvIDvQCPnwA0=/fit-in/180x430/filters:format(png):upscale()/s.siteapi.org/fd0650dee05b0a9.ru/logo/42tw87xnlkg04cwck04o0ow0g8oowg"
           alt="Albakore" width="160">
    </a>

    <nav class="header__nav" [class.header__nav--open]="menuOpen()">
      @for (link of navLinks; track link.label) {
        <a [href]="link.href" class="header__link" (click)="closeMenu()">{{ link.label }}</a>
      }
      <a href="tel:+78129301628" class="btn btn--primary header__cta-mobile">8 (812) 930-16-28</a>
    </nav>

    <a href="tel:+78129301628" class="btn btn--primary header__phone">8 (812) 930-16-28</a>

    <button class="header__burger" (click)="toggleMenu()" [class.header__burger--open]="menuOpen()" aria-label="Меню">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
