<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" fill="none">
  <!-- Иконка: рубильный диск (круг с лезвиями) -->
  <g transform="translate(4, 4)">
    <!-- Внешний круг -->
    <circle cx="20" cy="20" r="19" stroke="#E21134" stroke-width="2" fill="none"/>
    <!-- Центральная втулка -->
    <circle cx="20" cy="20" r="5" fill="#E21134"/>
    <!-- Лезвия (4 штуки, как у рубильного диска) -->
    <path d="M20 15 L23 5 Q20 3 17 5 Z" fill="#E21134" opacity="0.85"/>
    <path d="M25 20 L35 17 Q37 20 35 23 Z" fill="#E21134" opacity="0.85"/>
    <path d="M20 25 L17 35 Q20 37 23 35 Z" fill="#E21134" opacity="0.85"/>
    <path d="M15 20 L5 23 Q3 20 5 17 Z" fill="#E21134" opacity="0.85"/>
  </g>

  <!-- Текст RUB -->
  <text x="52" y="30" font-family="'Onest', 'Arial', sans-serif" font-weight="700" font-size="22" fill="#ffffff" letter-spacing="1">RUB</text>
  <!-- Текст MASTER красным -->
  <text x="101" y="30" font-family="'Onest', 'Arial', sans-serif" font-weight="700" font-size="22" fill="#E21134" letter-spacing="1">MASTER</text>
  <!-- Подпись -->
  <text x="52" y="42" font-family="'Onest', 'Arial', sans-serif" font-weight="400" font-size="8" fill="rgba(255,255,255,0.55)" letter-spacing="2">РУБИЛЬНЫЕ МАШИНЫ</text>
</svg>
